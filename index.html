<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Respire &amp; Dissolve</title>

<style>
/* Layout: one centred column (max 760px). Home = rank card + "chromatogram" of topics (each topic is a paper strip whose spot rises with mastery) + start. Play = sticky progress bar, question card, feedback panel. */
:root{
  --bg:#eaf0f1; --surface:#ffffff; --surface-2:#f4f8f9; --ink:#13212a; --muted:#56666f; --line:#d2dce0;
  --accent:#1f62c9; --accent-2:#e3edfb; --accent-ink:#ffffff;
  --good:#167a46; --good-bg:#e1f4e9; --bad:#c42f2f; --bad-bg:#fbe6e4; --hint:#8a5a00; --hint-bg:#fff1d2;
  --flame:#ec5f1f; --gold:#c98a00; --paper:#ffffff; --shadow:0 1px 2px rgba(19,33,42,.06),0 6px 20px rgba(19,33,42,.06);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d161b; --surface:#15222a; --surface-2:#1b2b34; --ink:#e5eef1; --muted:#98aab3; --line:#2b3d47;
  --accent:#6aa6f7; --accent-2:#1d3350; --accent-ink:#0d161b;
  --good:#5bd193; --good-bg:#153526; --bad:#f27b7b; --bad-bg:#3b1f22; --hint:#f3c063; --hint-bg:#3a2d12;
  --flame:#ff8a4c; --gold:#f0c24f; --paper:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d161b; --surface:#15222a; --surface-2:#1b2b34; --ink:#e5eef1; --muted:#98aab3; --line:#2b3d47;
  --accent:#6aa6f7; --accent-2:#1d3350; --accent-ink:#0d161b;
  --good:#5bd193; --good-bg:#153526; --bad:#f27b7b; --bad-bg:#3b1f22; --hint:#f3c063; --hint-bg:#3a2d12;
  --flame:#ff8a4c; --gold:#f0c24f; --paper:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:clamp(22px,4.6vw,30px);font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:14px}
.iconbtn:hover{border-color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}

/* rank card */
.rank{padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.rank .who{display:flex;flex-direction:column;gap:6px;min-width:0}
.rank .title{font-family:var(--f-display);font-weight:800;font-size:24px}
.xpbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7d5cd6);border-radius:99px;transition:width .5s}
.statrow{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.namefield{display:flex;gap:8px;align-items:center}
.namefield input{font:inherit;font-size:15px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:180px;max-width:100%}

/* chromatogram picker */
.chrom{padding:18px}
.chrom-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chrom-head h2{font-size:21px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lanes-scroll{overflow-x:auto;padding:4px 4px 6px}
.lanes{display:grid;grid-template-columns:repeat(8,minmax(66px,1fr));gap:8px;min-width:560px;position:relative}
.lane{cursor:pointer;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center}
.strip{position:relative;height:170px;background:var(--paper);border:1px solid var(--line);border-radius:4px;transition:transform .15s, box-shadow .15s}
.lane[aria-pressed="true"] .strip{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.lane:hover .strip{transform:translateY(-2px)}
.strip .front{position:absolute;left:0;right:0;top:14px;border-top:1.5px dashed #9fb3bf}
.strip .start{position:absolute;left:0;right:0;bottom:18px;border-top:1.5px dotted #6d7f89}
.strip .spot{position:absolute;left:50%;width:26px;height:32px;margin-left:-13px;border-radius:50%;filter:blur(.4px);transition:bottom .8s cubic-bezier(.2,.8,.2,1)}
.strip .pct{position:absolute;left:0;right:0;bottom:2px;font:600 11px var(--f-mono);color:#56666f}
.lane .code{font-family:var(--f-mono);font-weight:700;font-size:13px}
.lane .nm{font-size:12px;line-height:1.2;color:var(--muted);min-height:2.4em;hyphens:manual}
.chrom-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tchip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:15px;line-height:1.25}
.tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2)}
.tchip[aria-pressed="false"] b{color:var(--muted)}
.ttag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.big{border:0;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:800;font-size:19px;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}
.ghost:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* badges */
.badges{padding:18px}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.badge{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;line-height:1.2}
.badge .medal{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-mono);color:#fff;background:var(--muted)}
.badge.on .medal{background:radial-gradient(circle at 35% 30%,#ffe08a,var(--gold) 70%);color:#5a3a00}
.badge:not(.on){opacity:.5}
.reset{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.danger{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:700}
.danger.solid{background:var(--bad);color:#fff}

/* play */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 10px;display:flex;flex-direction:column;gap:8px}
.hudrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prog{flex:1;height:14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:99px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-weight:700;font-size:15px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.pill.hot{color:var(--flame);border-color:var(--flame)}
.flame{width:14px;height:18px}
.qcard{padding:20px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff}
.again{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--hint-bg);color:var(--hint)}
.qtext{font-size:clamp(19px,3.4vw,22px);font-weight:700;line-height:1.35}
.fig{background:#ffffff;border:1px solid #d6dfe3;border-radius:12px;padding:10px;overflow-x:auto;
  --d-ink:#26323b;--d-label:#1d2a33;--d-skin:#fbeee4;--d-lung:#f6c9cf;--d-lung-dot:#e79aa6;--d-air:#ffffff;--d-bone:#fffaf0;--d-muscle:#c2463f;--d-plasma:#fbefb8;--d-blood:#d93636;--d-blood-dark:#8f1d1d;--d-blood-light:#f07a72;--d-o2:#1f6fd1;--d-co2:#6b4bb8;--d-water:#d6ecfb;--d-glass:#f3f8fb;--d-paper:#ffffff;--d-wbc:#eef1f7;--d-nucleus:#6a3d9a;--d-mito:#f2b35c;--d-cell:#e8f1fb;--d-bact:#e9a23b;--d-ab:#1f6fd1;--d-grid:#dbe3e8;--d-rubber:#c97b4a;--d-lime:#eef6f2;--d-pea:#7cbf4a;--d-deadpea:#b9b08c;--d-wool:#ffffff;--d-water-p:#6f8fd8;--d-sugar-p:#e4573d;--d-green-p:#5b9a3c;--d-box:#f4f7f9;--d-bubble:#1d2a33;--d-bubble-ring:#ffffff;--d-bubble-text:#ffffff;--d-hl:#f2a516;--d-hl-ring:#ffffff;--d-font:var(--f-body)}
.fig .dg{max-height:440px}
.fig.zoomable{cursor:zoom-in;position:relative}
.fig.zoomable.zoom{cursor:zoom-out}
.fig.zoom .dg{min-width:680px;max-height:none}
.zoomhint{font-size:12px;color:#56666f;margin:4px 2px 0}
.fig.narrow .dg{max-width:420px;margin:0 auto}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:17px;line-height:1.35;transition:border-color .12s, background .12s, transform .08s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 13px var(--f-mono);background:var(--surface);border:1px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-2)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;text-decoration-thickness:1px}
.opt:disabled{cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1.5px dashed var(--line);border-radius:12px}
.bank span{font-size:14px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.bank .used{opacity:.4;text-decoration:line-through}
.blanktext{font-size:18px;line-height:2.3}
.blanktext select{font:inherit;font-size:16px;padding:3px 6px;border-radius:8px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);max-width:100%}
.blanktext select.right{border-color:var(--good);background:var(--good-bg)}
.blanktext select.wrong{border-color:var(--bad);background:var(--bad-bg)}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input,.fillrow input{font:inherit;font-size:20px;font-family:var(--f-mono);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:180px;max-width:100%}
.fillrow input{width:min(440px,100%);font-family:var(--f-body)}
.numrow input:focus,.fillrow input:focus{border-color:var(--accent);outline:none}
.order{display:grid;gap:12px}
.order h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.olist{display:flex;flex-direction:column;gap:8px;min-height:48px;padding:8px;border:1.5px dashed var(--line);border-radius:12px}
.oitem{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:16px}
.oitem .n{flex:none;font:700 13px var(--f-mono);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.oitem.right{border-color:var(--good);background:var(--good-bg)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-bg)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.fb{padding:16px 18px;border-radius:var(--r);display:flex;flex-direction:column;gap:8px;border:1px solid transparent;animation:pop .25s ease-out}
.fb h3{font-size:22px}
.fb.good{background:var(--good-bg);border-color:var(--good)}
.fb.good h3{color:var(--good)}
.fb.hint{background:var(--hint-bg);border-color:var(--hint)}
.fb.hint h3{color:var(--hint)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.bad h3{color:var(--bad)}
.fb .ans{font-weight:700}
.xpfloat{font-family:var(--f-mono);font-weight:700;color:var(--good)}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* end */
.end{padding:24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.end h2{font-size:clamp(28px,6vw,40px);font-weight:800}
.endstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.endstats div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.endstats b{display:block;font-family:var(--f-mono);font-size:26px}
.tough{width:100%;display:flex;flex-direction:column;gap:8px}
.tough li{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;list-style:none}
.tough ul{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-weight:700;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast .medal{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe08a,#c98a00 70%);flex:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.note{font-size:13px;color:var(--muted)}
@media (max-width:520px){ .rank{grid-template-columns:1fr} .qcard{padding:16px} .big{width:100%} .chrom-foot .seg{width:100%} .seg button{flex:1} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>


<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} html{color-scheme:light} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>

<script>
(function(){
  var files=[['Science8_Key_Facts.pdf','Key Facts to Memorise','chapter by chapter'],['Science8_Diagrams.pdf','Diagrams to Know','with label-it-yourself pages'],['Science8_Tables.pdf','Important Tables','textbook and worksheet tables']];
  function exists(u){ return fetch(u,{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok}).catch(function(){return false}); }
  Promise.all(files.map(function(f){
    return exists('pdfs/'+f[0]).then(function(ok){ if(ok) return 'pdfs/'+f[0]; return exists(f[0]).then(function(ok2){ return ok2 ? f[0] : null; }); });
  })).then(function(paths){
    var list=[]; paths.forEach(function(p,i){ if(p) list.push({name:files[i][1],desc:files[i][2],href:p}); });
    if(list.length){ window.STUDY_PDFS=list; if(window.__rerender) window.__rerender(); }
  });
})();
</script>

<script>
/* Diagram library: every figure is drawn from these functions, so the quiz and the PDFs show the same pictures.
   Each fn(opts) returns an SVG string.
   opts.mode: 'names' (text labels) | 'letters' (letter bubbles) | 'none'
   opts.letters: { key: 'A', ... }  – in letters mode only these keys are shown */
(function (root) {
  const DIAG_CSS = `
.dg{width:100%;height:auto;display:block;font-family:var(--d-font, system-ui, sans-serif)}
.dg text{fill:var(--d-label);font-size:13px}
.dg .ink{stroke:var(--d-ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dg .inkf{fill:var(--d-ink)}
.dg .lead{stroke:var(--d-label);stroke-width:1;fill:none;opacity:.85}
.dg .bub{fill:var(--d-bubble);stroke:var(--d-bubble-ring);stroke-width:1.5}
.dg .bubt{fill:var(--d-bubble-text)!important;font-weight:700;font-size:14px!important;text-anchor:middle;dominant-baseline:central}
.dg .hl{fill:var(--d-hl);stroke:var(--d-hl-ring)}
.dg .cap{font-size:12px!important;opacity:.8}
.dg .small{font-size:11.5px!important}
.dg .bold{font-weight:700}
.dg .skin{fill:var(--d-skin);stroke:var(--d-ink);stroke-width:1.6}
.dg .lung{fill:var(--d-lung);stroke:var(--d-ink);stroke-width:1.5}
.dg .lungdots{fill:var(--d-lung-dot)}
.dg .tubeO{stroke:var(--d-ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .tubeI{stroke:var(--d-air);fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg .ring{stroke:var(--d-ink);stroke-width:1.3;fill:none}
.dg .rib{fill:var(--d-bone);stroke:var(--d-ink);stroke-width:1.2}
.dg .muscle{stroke:var(--d-muscle);stroke-linecap:round;fill:none}
.dg .musclef{fill:var(--d-muscle)}
.dg .air{fill:var(--d-air)}
.dg .plasma{fill:var(--d-plasma)}
.dg .rbc{fill:var(--d-blood);stroke:var(--d-blood-dark);stroke-width:1.2}
.dg .rbcin{fill:var(--d-blood-light)}
.dg .o2{stroke:var(--d-o2);stroke-width:3;fill:none}

  const LIGHT_VARS = {
    '--d-ink':'#26323b','--d-label':'#1d2a33','--d-skin':'#fbeee4','--d-lung':'#f6c9cf','--d-lung-dot':'#e79aa6',

    '--d-glass':'#f3f8fb','--d-paper':'#ffffff','--d-wbc':'#eef1f7','--d-nucleus':'#6a3d9a','--d-mito':'#f2b35c',
    '--d-cell':'#e8f1fb','--d-bact':'#e9a23b','--d-ab':'#1f6fd1','--d-grid':'#dbe3e8','--d-rubber':'#c97b4a',

  // ---------- helpers ----------
  const f = n => Math.round(n * 10) / 10;
  function svg(vb, inner, label) {
    return `<svg class="dg" viewBox="${vb}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${defs()}${inner}</svg>`;
  }
  function defs() {
    const m = (id, cls) => `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(${cls})"/></marker>`;
    return `<defs>${m('ah-ink','--d-label')}${m('ah-o2','--d-o2')}${m('ah-co2','--d-co2')}${m('ah-blood','--d-blood')}${m('ah-mus','--d-muscle')}</defs>`;
  }
  // label: target point (tx,ty), label point (lx,ly), anchor 'start'|'end'|'middle'
  function makeLabeler(opts) {
    const mode = opts.mode || 'names';
    const letters = opts.letters || {};
    return function lab(key, tx, ty, lx, ly, anchor, text) {
      if (mode === 'none') return '';
      if (mode === 'letters') {
        const L = letters[key];
        if (!L) return '';
        const hl = opts.highlight === key ? ' hl' : '';
        return `<line class="lead" x1="${tx}" y1="${ty}" x2="${lx}" y2="${ly}"/><circle class="bub${hl}" cx="${lx}" cy="${ly}" r="11"/><text class="bubt" x="${lx}" y="${ly}">${L}</text>`;
      }
      if (!text) return '';
      const lines = String(text).split('\n');
      const dx = anchor === 'end' ? -4 : anchor === 'start' ? 4 : 0;
      const y0 = ly - (lines.length - 1) * 7.5;
      const t = lines.map((s, i) => `<tspan x="${lx + dx}" y="${y0 + i * 15 + 4}">${s}</tspan>`).join('');
      return `<line class="lead" x1="${tx}" y1="${ty}" x2="${lx}" y2="${ly}"/><text text-anchor="${anchor}">${t}</text>`;
    };
  }
  function tube(d, w) { return `<path class="tubeO" d="${d}" style="stroke-width:${w + 3.2}"/><path class="tubeI" d="${d}" style="stroke-width:${w}"/>`; }
  // deterministic pseudo random
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  // ---------- 1. Respiratory system ----------
  function respSystem(opts = {}) {
    const lab = makeLabeler(opts);
    let g = '';
    // torso
    g += `<path class="skin" d="M196,138 L196,165 C150,170 70,176 58,218 L58,440 L362,440 L362,218 C350,176 270,170 240,165 L240,138 Z"/>`;

    g += `<path class="skin" d="M240,142 C268,112 274,42 222,14 C186,0 164,24 167,46 L149,71 L165,79 L159,90 L166,96 L161,104 C164,118 180,124 196,132 L196,142 Z"/>`;
    // lungs
    g += `<path class="lung" d="M190,252 C186,226 162,212 141,216 C104,226 92,300 94,390 C130,397 168,398 192,393 Z"/>`;
    g += `<path class="lung" d="M230,252 C234,226 258,212 279,216 C316,226 328,300 326,390 C290,397 252,398 228,393 Z"/>`;
    // alveoli texture on right lung
    const r = rng(7);
    for (let i = 0; i < 160; i++) {

      const inside = (x - 279) ** 2 / (46 ** 2) + (y - 305) ** 2 / (88 ** 2) < 0.92;
      if (inside) g += `<circle class="lungdots" cx="${f(x)}" cy="${f(y)}" r="${f(2 + r() * 1.6)}"/>`;
    }
    // air passages
    g += tube('M157,74 C178,70 196,68 204,80 L206,112', 7);
    g += tube('M163,98 C180,99 196,100 205,108', 7);
    g += tube('M205,108 L205,140', 9);
    // larynx
    g += `<rect x="194" y="140" width="22" height="22" rx="4" class="skin"/><rect x="199" y="143" width="12" height="16" rx="3" class="air"/>`;
    g += tube('M205,162 L205,240', 11);
    for (let y = 170; y <= 234; y += 9) g += `<path class="ring" d="M198.5,${y} q6.5,3 13,0"/>`;
    g += tube('M205,240 C192,250 175,258 155,282', 8);
    g += tube('M205,240 C218,250 235,258 258,282', 8);
    // bronchioles in left lung
    const br = [['M155,282 C145,296 132,306 122,318', 'M122,318 l-8,10', 'M122,318 l2,13'],
                ['M155,282 C156,300 152,316 148,334', 'M148,334 l-9,9', 'M148,334 l6,11'],
                ['M155,282 C166,294 172,306 176,322', 'M176,322 l-4,13', 'M176,322 l9,8']];
    br.forEach(b => { g += tube(b[0], 4.5); g += tube(b[1], 2.6); g += tube(b[2], 2.6); });
    const sacs = [[114, 330], [124, 333], [139, 345], [154, 347], [172, 337], [185, 331]];
    sacs.forEach(([x, y]) => { g += `<circle cx="${x}" cy="${y}" r="5" class="lung" style="fill:var(--d-air)"/><circle cx="${x + 5}" cy="${y + 5}" r="4" class="lung" style="fill:var(--d-air)"/>`; });
    g += tube('M258,282 C268,298 276,310 282,322', 4.5);
    // ribs & intercostal muscles
    for (const x of [74, 346]) {
      for (let k = 0; k < 7; k++) {
        const y = 226 + k * 24;
        if (k < 6) g += `<line class="muscle" x1="${x}" y1="${y + 5}" x2="${x}" y2="${y + 19}" style="stroke-width:7"/>`;
        g += `<ellipse class="rib" cx="${x}" cy="${y}" rx="8" ry="5.5"/>`;
      }
    }
    // diaphragm
    g += `<path class="muscle" d="M66,408 Q210,368 354,408" style="stroke-width:8"/>`;
    // labels
    g += lab('nose', 156, 73, 50, 58, 'end', 'entrance to nose');
    g += lab('mouth', 162, 98, 50, 102, 'end', 'entrance to mouth');
    g += lab('larynx', 216, 150, 375, 120, 'start', 'voicebox (larynx)');
    g += lab('trachea', 211, 196, 375, 165, 'start', 'windpipe (trachea)');
    g += lab('cartilage', 199, 216, 50, 160, 'end', 'rings of cartilage');
    g += lab('bronchus', 176, 262, 50, 220, 'end', 'bronchus\n(plural: bronchi)');
    g += lab('bronchiole', 132, 309, 50, 282, 'end', 'bronchiole');
    g += lab('airsacs', 118, 336, 50, 336, 'end', 'air sacs (alveoli)');
    g += lab('lung', 300, 300, 375, 300, 'start', 'lung');
    g += lab('rib', 352, 250, 375, 230, 'start', 'rib bone');
    g += lab('intercostal', 346, 357, 375, 360, 'start', 'muscles between ribs\n(intercostal muscles)');
    g += lab('diaphragm', 296, 396, 375, 418, 'start', 'diaphragm');
    return svg(opts.mode === 'letters' ? '30 0 368 450' : '-95 0 615 450', g, 'The human respiratory system');
  }

  // ---------- 2. Air sac and capillary ----------
  function airSac(opts = {}) {
    const lab = makeLabeler(opts);
    const cx = 230, cy = 172, R = 89;
    let g = '';
    // capillary
    const cap = `M110,96 L146,142 A${R},${R} 0 1,0 314,142 L350,96`;
    g += `<path d="${cap}" style="stroke:var(--d-ink);stroke-width:27;fill:none;stroke-linejoin:round"/>`;
    g += `<path d="${cap}" style="stroke:var(--d-plasma);stroke-width:23;fill:none;stroke-linejoin:round"/>`;
    // sac
    g += `<path d="M208,10 L208,105 A70,70 0 1,0 252,105 L252,10" style="fill:var(--d-air);stroke:var(--d-ink);stroke-width:2.4"/>`;
    // red cells along capillary
    [195, 165, 135, 105, 75, 45, 15, -15].forEach(a => {
      const t = a * Math.PI / 180, x = cx + R * Math.cos(t), y = cy + R * Math.sin(t);
      g += `<ellipse class="rbc" cx="${f(x)}" cy="${f(y)}" rx="8" ry="6.5" transform="rotate(${a + 90} ${f(x)} ${f(y)})"/><ellipse class="rbcin" cx="${f(x)}" cy="${f(y)}" rx="3.2" ry="2.4" transform="rotate(${a + 90} ${f(x)} ${f(y)})"/>`;
    });
    // air arrows
    g += `<path class="flow" d="M222,18 L222,70" marker-end="url(#ah-ink)"/><path class="flow" d="M238,70 L238,18" marker-end="url(#ah-ink)"/>`;
    // blood flow arrows
    g += `<path class="bloodflow" d="M70,70 L104,104" marker-end="url(#ah-blood)"/><path class="bloodflow" d="M356,104 L390,70" marker-end="url(#ah-blood)"/>`;
    // diffusion arrows
    g += `<path class="o2" d="M250,196 L270,236" marker-end="url(#ah-o2)"/>`;
    g += `<path class="co2" d="M188,240 L206,202" marker-end="url(#ah-co2)"/>`;
    g += lab('airin', 222, 40, 150, 22, 'end', 'air moving in');
    g += lab('airout', 238, 40, 310, 22, 'start', 'air moving out');
    g += lab('fromheart', 72, 72, 40, 120, 'middle', '');
    g += lab('toheart', 388, 72, 420, 120, 'middle', '');
    if (opts.mode === 'names') {
      g += `<text x="62" y="64" text-anchor="end" class="small">blood flowing</text><text x="62" y="78" text-anchor="end" class="small">from the heart</text>`;
      g += `<text x="398" y="64" class="small">blood flowing</text><text x="398" y="78" class="small">towards the heart</text>`;
    }
    g += lab('airinside', 230, 150, 40, 168, 'end', 'air inside sac');
    g += lab('sacwall', 162, 186, 40, 200, 'end', 'thin wall of air sac');

    g += lab('co2', 194, 224, 40, 290, 'end', 'diffusion of carbon dioxide\n(blood → air sac)');
    g += lab('rbc', 207, 258, 150, 330, 'end', 'red blood cell');
    g += lab('plasma', 262, 264, 320, 330, 'start', 'blood plasma');
    g += lab('o2', 262, 220, 420, 214, 'start', 'diffusion of oxygen\n(air sac → blood)');
    return svg(opts.mode === 'letters' ? '22 0 422 345' : '-150 0 730 345', g, 'An air sac and blood capillary');
  }

  // ---------- 3. Breathing in / out ----------
  function chest(x0, inhale) {
    // x0 = centre x
    let g = '';
    const lungW = inhale ? 62 : 52, top = 56, bot = inhale ? 214 : 198;
    const dome = inhale ? 206 : 172; // diaphragm centre y
    const left = `M${x0 - 10},96 C${x0 - 14},70 ${x0 - 30},${top} ${x0 - 45},${top + 2} C${x0 - lungW - 18},${top + 14} ${x0 - lungW - 22},${bot - 60} ${x0 - lungW - 20},${bot} Q${x0 - 40},${(bot + dome) / 2 - 4} ${x0 - 10},${dome + 4} Z`;
    const right = left.replace(/M([\d.]+),/, (m) => m); // placeholder
    g += `<path class="lung" d="${left}"/>`;
    g += `<path class="lung" d="${left}" transform="translate(${2 * x0},0) scale(-1,1)"/>`;
    g += tube(`M${x0},10 L${x0},84`, 9);
    g += tube(`M${x0},84 C${x0 - 8},92 ${x0 - 18},98 ${x0 - 28},110`, 6);
    g += tube(`M${x0},84 C${x0 + 8},92 ${x0 + 18},98 ${x0 + 28},110`, 6);
    // ribs: chain on each side
    const n = 7;
    for (const s of [-1, 1]) {
      for (let k = 0; k < n; k++) {
        const t = k / (n - 1);
        const spread = inhale ? 102 : 88;
        const x = x0 + s * (spread - 6 * (1 - Math.sin(t * Math.PI)) + (inhale ? 6 * Math.sin(t * Math.PI) : 0));
        const y = (inhale ? 46 : 54) + t * ((inhale ? 214 : 198) - (inhale ? 46 : 54));
        if (k < n - 1) {
          const y2 = (inhale ? 46 : 54) + (k + 1) / (n - 1) * ((inhale ? 214 : 198) - (inhale ? 46 : 54));
          g += `<line class="muscle" x1="${f(x)}" y1="${f(y + 5)}" x2="${f(x)}" y2="${f(y2 - 5)}" style="stroke-width:5"/>`;
        }
        g += `<ellipse class="rib" cx="${f(x)}" cy="${f(y)}" rx="7" ry="5" transform="rotate(${s * (inhale ? -18 : 12)} ${f(x)} ${f(y)})"/>`;
      }
    }
    const ex = inhale ? 104 : 90;
    g += `<path class="muscle" d="M${x0 - ex},${inhale ? 218 : 202} Q${x0},${inhale ? 196 : 140} ${x0 + ex},${inhale ? 218 : 202}" style="stroke-width:6"/>`;
    return g;
  }
  function breathing(opts = {}) {
    let g = '';
    g += chest(150, true) + chest(470, false);
    g += `<path class="flow" d="M150,-30 L150,18" marker-end="url(#ah-ink)" style="stroke:var(--d-o2);stroke-width:3"/>`;
    g += `<path class="flow" d="M470,18 L470,-30" marker-end="url(#ah-ink)" style="stroke:var(--d-co2);stroke-width:3"/>`;
    // movement arrows
    g += `<path class="flow" d="M266,120 l18,-14" marker-end="url(#ah-ink)"/><path class="flow" d="M34,120 l-18,-14" marker-end="url(#ah-ink)"/>`;
    g += `<path class="flow" d="M150,228 l0,22" marker-end="url(#ah-ink)"/>`;
    g += `<path class="flow" d="M570,96 l-14,14" marker-end="url(#ah-ink)"/><path class="flow" d="M370,96 l14,14" marker-end="url(#ah-ink)"/>`;
    g += `<path class="flow" d="M470,190 l0,-26" marker-end="url(#ah-ink)"/>`;
    if (opts.mode !== 'letters') {
      g += `<text x="150" y="-38" text-anchor="middle" class="bold">Breathing in (inhaling)</text>`;
      g += `<text x="470" y="-38" text-anchor="middle" class="bold">Breathing out (exhaling)</text>`;
      g += `<text x="150" y="268" text-anchor="middle" class="small">intercostal muscles CONTRACT: ribs move up and out</text>`;
      g += `<text x="150" y="284" text-anchor="middle" class="small">diaphragm CONTRACTS: moves down (flattens)</text>`;
      g += `<text x="150" y="300" text-anchor="middle" class="small">chest volume ↑ · pressure ↓ · air moves IN</text>`;
      g += `<text x="470" y="268" text-anchor="middle" class="small">intercostal muscles RELAX: ribs drop down and in</text>`;
      g += `<text x="470" y="284" text-anchor="middle" class="small">diaphragm RELAXES: back to its domed shape</text>`;
      g += `<text x="470" y="300" text-anchor="middle" class="small">chest volume ↓ · pressure ↑ · air squeezed OUT</text>`;
    }
    return svg('-20 -60 660 372', g, 'Breathing in and breathing out');
  }

  // ---------- 4. Blood cells ----------
  function bloodCells(opts = {}) {
    const lab = makeLabeler(opts);

    g += `<defs><radialGradient id="rbcg"><stop offset="0" style="stop-color:var(--d-blood-light)"/><stop offset=".55" style="stop-color:var(--d-blood-light)"/><stop offset="1" style="stop-color:var(--d-blood)"/></radialGradient></defs>`;

  // ---------- 5. White blood cells v pathogens ----------
  function wbcDefence(opts = {}) {
    let g = '';
    const Y = (x, y, a) => `<path class="ab" d="M${x},${y} l0,9 M${x},${y} l-5,-6 M${x},${y} l5,-6" transform="rotate(${a} ${x} ${y})"/>`;
    const bac = (x, y, a) => `<rect class="bact" x="${x - 9}" y="${y - 3.5}" width="18" height="7" rx="3.5" transform="rotate(${a} ${x} ${y})"/>`;
    // panel 1: engulf
    g += `<path class="wbc" d="M60,150 C30,120 40,60 95,52 C150,46 175,90 160,108 C150,96 132,96 128,112 C124,128 140,138 156,132 C170,160 120,190 90,184 C70,180 64,166 60,150 Z"/>`;
    g += `<path class="nuc" d="M70,120 C62,100 82,86 96,98 C108,108 96,126 110,138 C120,150 98,162 88,148 C82,138 76,134 70,120Z"/>`;
    g += bac(142, 115, 20);
    // panel 2: antibodies
    g += `<circle class="wbc" cx="330" cy="118" r="58"/><circle class="nuc" cx="338" cy="122" r="30"/>`;
    [[255, 70, -30], [262, 120, -80], [270, 168, -120], [240, 150, 40], [232, 96, 10], [282, 50, 30]].forEach(([x, y, a]) => g += Y(x, y, a));
    [[218, 120, 10], [210, 70, 60], [220, 168, -20]].forEach(([x, y, a]) => g += bac(x, y, a));
    // panel 3: clumped
    let cl = '';
    [[495, 112, 10], [510, 122, -40], [500, 132, 70], [518, 104, 30], [522, 136, -10]].forEach(([x, y, a]) => cl += bac(x, y, a));
    [[505, 98, 20], [528, 120, -60], [490, 126, 90], [512, 144, 160]].forEach(([x, y, a]) => cl += Y(x, y, a));
    g += cl;
    if (opts.mode !== 'letters') {
      g += `<text x="100" y="214" text-anchor="middle" class="small">pushes out ‘fingers’ of cytoplasm,</text><text x="100" y="229" text-anchor="middle" class="small">captures the pathogen, then makes</text><text x="100" y="244" text-anchor="middle" class="small">chemicals that kill and digest it</text>`;
      g += `<text x="290" y="214" text-anchor="middle" class="small">makes antibodies (Y shapes)</text><text x="290" y="229" text-anchor="middle" class="small">that stick to the pathogen</text><text x="290" y="244" text-anchor="middle" class="small">and can kill it directly</text>`;
      g += `<text x="508" y="214" text-anchor="middle" class="small">antibodies glue pathogens</text><text x="508" y="229" text-anchor="middle" class="small">together so they cannot move;</text><text x="508" y="244" text-anchor="middle" class="small">other white cells kill them</text>`;
      g += `<text x="142" y="98" class="small">pathogen</text><text x="290" y="40" text-anchor="middle" class="small">bacteria (pathogens) and antibodies</text>`;
    }
    return svg('-4 20 610 236', g, 'How white blood cells destroy pathogens');
  }

  // ---------- 6. Respiration in a mitochondrion ----------
  function mito(opts = {}) {
    let g = '';

  // ---------- 9. Dissolving (particles) ----------

<script>

function startRun(){
  let pool = Q.filter(q=>S.sel.includes(q.topic) && S.types.includes(q.type) && S.srcs.includes(q.src)).map(q=>q.id);
  if(!pool.length) return;
  if(S.size!=='all' && pool.length>ROUND){
    // random 30: questions not yet mastered first (in random order), then mastered ones, most-missed first
    // up to 12 worksheet questions per round (not yet mastered first), then the rest at random, unmastered first
    const isWs = id => ['ws1','ws2'].includes(QI[id].src);
    const order = ids => { const fresh=shuffle(ids.filter(id=>!st(id).mastered)); const known=shuffle(ids.filter(id=>st(id).mastered)).sort((a,b)=>st(b).wrong-st(a).wrong); return fresh.concat(known); };
    const ws = order(pool.filter(isWs)).slice(0,12);
    const rest = order(pool.filter(id=>!ws.includes(id)));
    const freshRest = rest.filter(id=>!st(id).mastered), knownRest = rest.filter(id=>st(id).mastered);
    pool = ws.concat(freshRest, knownRest, order(pool.filter(isWs)).slice(12)).filter((v,i,a)=>a.indexOf(v)===i).slice(0,ROUND);
  }
  S.run = { queue: shuffle(pool), total: pool.length, done: [], firstTry: 0, attempts: 0, xp: 0, misses: {}, wrongFirst: 0 };
  S.streak = 0; save(); view='play'; cur=null; render();
}

// ---------- play ----------
let view = 'home', cur = null; // cur = { id, attempt, shown:{...}, locked }
// Correct-answer position is random (A, B, C, D equally likely), but the same letter never comes up 3 times running,
// and a letter that has come up a lot more than the others this session is skipped until the others catch up.
const posCount = {}, lastTwo = {};
function nextPos(n){
  const cnt = (posCount[n] ||= Array(n).fill(0)), last = (lastTwo[n] ||= []);
  const min = Math.min(...cnt);
  let opts = [...Array(n).keys()].filter(i => cnt[i] <= min + 2);
  if(last.length===2 && last[0]===last[1]) opts = opts.filter(i => i!==last[0]) ;
  if(!opts.length) opts = [...Array(n).keys()];
  const p = opts[Math.floor(Math.random()*opts.length)];
  cnt[p]++; last.push(p); if(last.length>2) last.shift(); return p;
}
function newShow(id){
  const q = QI[id]; const s = { id, attempt:1, locked:false };
  if(q.t==='mcq'){ const others=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.a)); others.splice(nextPos(q.opts.length),0,q.a); s.perm=others; s.sel=[]; s.disabled=[]; }
  if(q.t==='multi'){ s.perm = shuffle(q.opts.map((_,i)=>i)); s.sel = []; s.disabled = []; }
  if(q.t==='order'){ let p; do{ p=shuffle(q.items.map((_,i)=>i)); }while(q.items.length>1 && p.every((v,i)=>v===i)); s.pool=p; s.picked=[]; }
  if(q.t==='blanks'){ s.vals = q.blanks.map(()=> ''); s.opts = q.blanks.map(b => b.opts ? shuffle(b.opts) : q.bank.slice().sort((a,b)=>a.localeCompare(b))); }
  if(q.t==='num' || q.t==='fill') s.val='';
  return s;
}
function figHtml(q){
  if(!q.fig) return '';
  const f=q.fig, hasL = f.letters && Object.keys(f.letters).length;
  const mode = f.mode || (hasL ? 'letters' : 'names');
  const svg = window.DIAG[f.name]({ mode, letters:f.letters||{}, highlight:f.highlight, noCaption:f.noCaption });
  const narrow = ['foodDyes','syringe','peas','bloodCells','concDilute','limewater'].includes(f.name);
  const zoomable = ['solCurves2','zGraph','solGraph','chromXY','respSystem','airSac','beakersPQR','sunnyRed'].includes(f.name);
  return `<div class="fig ${narrow?'narrow':''} ${zoomable?'zoomable':''}" ${zoomable?'role="button" tabindex="0" aria-label="Zoom the diagram"':''}>${svg}${zoomable?'<div class="zoomhint">Tap the diagram to zoom in or out</div>':''}</div>`;
}
function answerText(q){
  if(q.t==='mcq') return q.opts[q.a];
  if(q.t==='multi') return q.a.map(i=>q.opts[i]).join('; ');
  if(q.t==='num') return `${q.a} ${q.unit||''}`;
  if(q.t==='fill') return q.ans[0];
  if(q.t==='order') return q.items.map((x,i)=>`${i+1}. ${x}`).join('  ');
  if(q.t==='blanks'){ let i=0; return q.text.replace(/\[\[(\d+)\]\]/g,(_,n)=>`<u>${esc(q.blanks[+n].ans[0])}</u>`); }
  return '';
}

function play(){

function answerUI(q){
  const s=cur;
  if(q.t==='mcq' || q.t==='multi'){
    const keys='ABCDEFGH';
    return `${q.t==='multi'?'<p class="note" style="margin:0 0 8px">Choose all that apply, then press Check.</p>':''}<div class="opts">${s.perm.map((oi,k)=>{
      const cls = s.locked && (q.t==='mcq'? oi===q.a : q.a.includes(oi)) ? 'right' : (s.disabled.includes(oi)?'wrong':'');
      return `<button class="opt ${cls}" data-o="${oi}" aria-pressed="${s.sel.includes(oi)}" ${s.locked||s.disabled.includes(oi)?'disabled':''}><span class="k">${keys[k]}</span><span>${esc(q.opts[oi])}</span></button>`; }).join('')}</div>`;
  }
  if(q.t==='num') return `<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="${esc(s.val)}" ${s.locked?'disabled':''}><span class="muted">${esc(q.unit||'')}</span></div>`;
  if(q.t==='fill') return `<div class="fillrow"><input id="fill" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer" value="${esc(s.val)}" ${s.locked?'disabled':''}></div><p class="note" style="margin:6px 0 0">Press Enter or Check. Small spelling slips are accepted.</p>`;
  if(q.t==='blanks'){
    const bank = q.bank ? `<div class="bank" aria-label="Word bank">${s.opts[0].map(w=>`<span class="${s.vals.includes(w)?'used':''}">${esc(w)}</span>`).join('')}</div>` : '';
    let html = esc(q.text).replace(/\[\[(\d+)\]\]/g,(_,n)=>{ n=+n; const cls = s.marks ? (s.marks[n]?'right':'wrong') : '';
      return `<select data-b="${n}" class="${cls}" aria-label="Blank ${n+1}" ${s.locked?'disabled':''}><option value="">choose…</option>${s.opts[n].map(o=>`<option ${s.vals[n]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`; });
    return `${bank}<div class="blanktext">${html}</div>`;
  }
  if(q.t==='order'){
    const pickedHtml = s.picked.map((i,k)=>{ const cls = s.marks ? (s.marks[k]?'right':'wrong') : ''; return `<button class="oitem ${cls}" data-un="${k}" ${s.locked?'disabled':''}><span class="n">${k+1}</span>${esc(q.items[i])}</button>`; }).join('') || '<span class="note" style="padding:6px">Tap the steps below in the right order.</span>';
    const left = s.pool.filter(i=>!s.picked.includes(i));
    return `<div class="order"><h4>Your order</h4><div class="olist">${pickedHtml}</div>${left.length?`<h4>Tap to add</h4><div class="olist">${left.map(i=>`<button class="oitem" data-pk="${i}">${esc(q.items[i])}</button>`).join('')}</div>`:''}${s.picked.length&&!s.locked?'<div><button class="ghost" id="oclear">Clear</button></div>':''}</div>`;
  }
  return '';
}
function refreshAns(q){ $('#ans').innerHTML = answerUI(q); bindAnswer(q); renderActions(q); }
function bindAnswer(q){
  const s=cur;
  if(q.t==='mcq') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(s.locked) return; s.sel=[+b.dataset.o]; submit(q); });
  if(q.t==='multi') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(s.locked) return; const o=+b.dataset.o; s.sel = s.sel.includes(o)? s.sel.filter(x=>x!==o) : [...s.sel,o]; refreshAns(q); });
  if(q.t==='num'){ const i=$('#num'); i.oninput=()=>{ s.val=i.value; renderActions(q); }; i.onkeydown=e=>{ if(e.key==='Enter' && s.val.trim()) submit(q); }; if(!s.locked) setTimeout(()=>i.focus({preventScroll:true}),30); }
  if(q.t==='fill'){ const i=$('#fill'); i.oninput=()=>{ s.val=i.value; renderActions(q); }; i.onkeydown=e=>{ if(e.key==='Enter' && s.val.trim()) submit(q); }; if(!s.locked) setTimeout(()=>i.focus({preventScroll:true}),30); }
  if(q.t==='blanks') app.querySelectorAll('select[data-b]').forEach(sel=>sel.onchange=()=>{ s.vals[+sel.dataset.b]=sel.value; if(s.marks) s.marks=null; refreshAns(q); const nx=app.querySelector(`select[data-b="${+sel.dataset.b+1}"]`); });
  if(q.t==='order'){
    app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{ s.picked.push(+b.dataset.pk); s.marks=null; refreshAns(q); });
    app.querySelectorAll('[data-un]').forEach(b=>b.onclick=()=>{ s.picked.splice(+b.dataset.un,1); s.marks=null; refreshAns(q); });
    if($('#oclear')) $('#oclear').onclick=()=>{ s.picked=[]; s.marks=null; refreshAns(q); };
  }
}
function ready(q){
  const s=cur;
  if(q.t==='multi') return s.sel.length>0;
  if(q.t==='num'||q.t==='fill') return s.val.trim()!=='';
  if(q.t==='blanks') return s.vals.every(v=>v);
  if(q.t==='order') return s.picked.length===q.items.length;
  return false;
}
function renderActions(q){
  const a=$('#acts'); if(!a) return;
  if(cur.locked || q.t==='mcq'){ a.innerHTML=''; return; }
  a.innerHTML = `<button class="big" id="check" ${ready(q)?'':'disabled'}>Check</button>`;
  $('#check').onclick=()=>submit(q);
}

function grade(q){
  const s=cur;
  if(q.t==='mcq') return { ok: s.sel[0]===q.a };
  if(q.t==='multi'){ const want=new Set(q.a); return { ok: s.sel.length===want.size && s.sel.every(i=>want.has(i)) }; }
  if(q.t==='num'){ const v=parseFloat(String(s.val).replace(/,/g,'').replace(/[^\d.\-]/g,'')); return { ok: !isNaN(v) && Math.abs(v-q.a)<= (q.tol||0)+1e-9 }; }
  if(q.t==='fill'){ const v=norm(s.val).replace(/^(the|a|an) /,''); const ok=q.ans.some(a=>norm(a)===v || norm(a).replace(/^(the|a|an) /,'')===v); if(ok) return {ok:true}; const near=q.ans.find(a=>{ const n=norm(a); return n.length>=5 && lev(n,v)<=(n.length>=9?2:1); }); return near?{ok:true,spell:near}:{ok:false}; }
  if(q.t==='blanks'){
    const marks = q.blanks.map((b,i)=> b.ans.map(norm).includes(norm(s.vals[i])));
    (q.pairs||[]).forEach(g=>{ const vals=g.map(i=>norm(s.vals[i])); const want=g.map(i=>norm(q.blanks[i].ans[0])); const okSet = vals.slice().sort().join('|')===want.slice().sort().join('|'); g.forEach(i=>marks[i]=okSet); });
    return { ok: marks.every(Boolean), marks };
  }
  if(q.t==='order'){ const marks = s.picked.map((v,k)=>v===k); return { ok: marks.every(Boolean), marks }; }
  return { ok:false };
}

function submit(q){
  const s=cur, run=S.run, g=grade(q), stt=st(q.id);
  stt.seen++;
  const fb=$('#fb');
  if(g.ok){
    s.locked=true;
    let gain, title, sub='';
    if(s.attempt===1){
      S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); S.totalRight++;
      gain = 10 + Math.min(10, Math.max(0, S.streak-2)*2);
      if(stt.everWrong && !stt.mastered) award('comeback');
      stt.mastered = true; if(!run.done.includes(q.id)) run.done.push(q.id);
      if(!(run.misses[q.id])) run.firstTry++;
      run.queue.shift();
      title = pick(CHEERS) + (S.name && Math.random()<.5 ? ` Well done${nm()}.` : '');
      if(S.streak===5) award('s5'); if(S.streak===10) award('s10'); if(S.streak===20) award('s20');
      award('first');
      if(S.streak>0 && S.streak%5===0) { confetti(); sub = `${S.streak} in a row!`; }
    } else {
      gain = 4; title = pick(FIXED);
      sub = 'This one comes back later in the round. Get it right first time to lock it in.';
      requeue(q.id, 3, 7);
    }
    S.xp += gain; run.xp += gain; sfx.good();
    if(q.t==='mcq' || q.t==='multi') refreshAns(q);
    if(q.t==='blanks'||q.t==='order'){ s.marks=g.marks; refreshAns(q); }
    if(q.t==='num'||q.t==='fill') refreshAns(q);
    fb.innerHTML = `<div class="fb good"><h3>${title}</h3>${sub?`<div><b>${esc(sub)}</b></div>`:''}${g.spell?`<div>Check the spelling: <b>${esc(g.spell)}</b></div>`:''}<div>${esc(q.why)}</div><div class="row" style="justify-content:space-between"><span class="xpfloat">+${gain} XP</span><button class="big" id="next">Next →</button></div></div>`;
    checkTopicBadges(); save();
    $('#next').onclick=next; $('#next').focus({preventScroll:true});
    fb.scrollIntoView({behavior: reduce?'auto':'smooth', block:'nearest'});
    updateHud();
    return;
  }
  // wrong
  sfx.wrong(); S.streak=0; $('#qcard').classList.remove('shake'); void $('#qcard').offsetWidth; $('#qcard').classList.add('shake');
  if(s.attempt===1){
    stt.wrong++; stt.everWrong=true; run.misses[q.id]=(run.misses[q.id]||0)+1; run.wrongFirst++;
    if(stt.mastered){ stt.mastered=false; run.done = run.done.filter(x=>x!==q.id); }
    s.attempt=2;
    if(q.t==='mcq'){ s.disabled.push(s.sel[0]); s.sel=[]; }
    if(q.t==='blanks'||q.t==='order') s.marks=g.marks;
    refreshAns(q);
    const extra = (q.t==='blanks') ? ' Red boxes are wrong, green are right.' : (q.t==='order' ? ' Green steps are in the right place.' : '');
    fb.innerHTML = `<div class="fb hint"><h3>${pick(NUDGE)}</h3><div>${esc(q.hint)}${extra}</div><div class="note">Have another go.</div></div>`;
    save(); updateHud(); return;
  }
  // second miss: reveal
  s.locked=true; run.misses[q.id]=(run.misses[q.id]||0)+1;
  if(q.t==='blanks'||q.t==='order') s.marks=g.marks;
  if(q.t==='mcq'){ s.disabled.push(s.sel[0]); }
  refreshAns(q);
  requeue(q.id, 2, 5);
  fb.innerHTML = `<div class="fb bad"><h3>${pick(REVEAL)}</h3><div>The answer is: <span class="ans">${q.t==='blanks'?answerText(q):esc(answerText(q))}</span></div><div>${esc(q.why)}</div><div class="note">It will come back soon so you can get it right.</div><div class="actions"><button class="big" id="next">Got it, next →</button></div></div>`;
  save(); updateHud();
  $('#next').onclick=next; $('#next').focus({preventScroll:true});
}
function requeue(id, lo, hi){ const qq=S.run.queue; qq.shift(); const pos=Math.min(qq.length, lo+Math.floor(Math.random()*(hi-lo+1))); qq.splice(pos,0,id); }
function updateHud(){ const run=S.run; const p=app.querySelector('.prog i'); if(p) p.style.width=Math.round(run.done.length/run.total*100)+'%'; const pills=app.querySelectorAll('.hud .pill'); if(pills[0]) pills[0].textContent=`${run.done.length}/${run.total}`; if(pills[1]) pills[1].textContent=`${S.xp} XP`; if(pills[2]){ pills[2].innerHTML=flameSvg+S.streak; pills[2].classList.toggle('hot',S.streak>=3);} }
function next(){ cur=null; if(!S.run.queue.length){ view='end'; } render(); window.scrollTo({top:0,behavior:'auto'}); }

function end(){
  const run=S.run; if(!run){ view='home'; return render(); }
  if(!run.finished){ run.finished=true; if(run.total>=10 && run.wrongFirst===0) award('sweep'); sfx.done(); confetti(140); save(); }
  const acc = run.total ? Math.round(run.firstTry/run.total*100) : 0;
  const tough = Object.entries(run.misses).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const r=rankOf(S.xp);
  app.innerHTML = header() + `<main class="stack"><section class="card end">
    <span class="lbl">Round complete</span><h2>Every question mastered${nm()}!</h2>
    <p style="margin:0">You kept going until you got every question right. That is exactly how you learn it for the test.</p>
    <div class="endstats"><div><b>${run.total}</b><span class="note">questions mastered</span></div><div><b>${acc}%</b><span class="note">right first time</span></div><div><b>+${run.xp}</b><span class="note">XP this round</span></div><div><b style="font-size:18px;font-family:var(--f-display)">${esc(r.name)}</b><span class="note">your rank</span></div></div>
    ${tough.length?`<div class="tough"><span class="lbl">Your trickiest questions: read these once more</span><ul>${tough.map(([id,n])=>{ const q=QI[id]; return `<li><b>${esc(q.q)}</b><br><span class="note">Answer:</span> ${q.t==='blanks'?answerText(q):esc(answerText(q))}</li>`; }).join('')}</ul></div>`:''}
    <div class="row"><button class="big" id="again">Play again</button><button class="ghost" id="hm">Choose topics</button></div>
  </section></main>`;
  bindHeader();
  $('#again').onclick=startRun; $('#hm').onclick=()=>{ S.run=null; save(); view='home'; render(); };
}

function render(){ if(view==='play') play(); else if(view==='end') end(); else home(); }
window.__rerender = function(){ if(view==='home') render(); };
document.addEventListener('keydown', e=>{
  if(view!=='play' || !cur) return;
  if(e.target.matches('input,select,textarea')) return;
  const q=QI[cur.id];
  if((q.t==='mcq'||q.t==='multi') && !cur.locked){ const k='abcdefgh'.indexOf(e.key.toLowerCase()); const n='12345678'.indexOf(e.key); const idx = k>=0?k:n; if(idx>=0 && idx<cur.perm.length){ const b=app.querySelectorAll('.opt')[idx]; if(b && !b.disabled) b.click(); } }
  if(e.key==='Enter'){ const n=$('#next'); if(n){ e.preventDefault(); n.click(); } }
});

function start(data){ if(data && data.S) S=Object.assign(blank(), data.S); if(data && data.view) view=data.view; if(view!=='home' && !(S.run&&S.run.queue.length)) view = S.run&&S.run.finished?'end':'home'; render(); }
if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({ S, view }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
